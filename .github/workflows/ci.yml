name: frontend-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install (no lockfile yet, so npm install)
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Each step prints its tail as annotations, because job logs can't be downloaded from the sandbox.
      - name: Typecheck
        run: |
          set +e; npm run typecheck > out.txt 2>&1; rc=$?
          head -c 3000 out.txt | tr '\n' '|' | sed 's/^/::notice title=typecheck::rc='$rc' /'; echo
          exit $rc
      - name: Test
        run: |
          set +e; npm test > out.txt 2>&1; rc=$?
          grep -E "^# (tests|pass|fail)|^not ok" out.txt | tr '\n' '|' | sed 's/^/::notice title=test::rc='$rc' /'; echo
          exit $rc
      - name: Build
        run: |
          set +e; npm run build > out.txt 2>&1; rc=$?
          tail -c 3000 out.txt | tr '\n' '|' | sed 's/^/::notice title=build::rc='$rc' /'; echo
          exit $rc
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://pc.playnextai.com

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Browser tools
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Run browser tests against a mock backend
        run: |
          node e2e/mock-backend.mjs > mock.log 2>&1 &
          npm start > start.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:3000/ > /dev/null && break; sleep 1; done
          node e2e/run.mjs 2>&1 | tee e2e.log
          if ! grep -q "e2e summary" e2e.log; then echo "::error title=e2e crashed::$(tail -c 1500 e2e.log | tr '\n' '|')"; fi
      - name: Publish the report to branch e2e-report (readable without log access)
        if: always()
        run: |
          mkdir /tmp/rep && cp e2e-report.txt e2e.log mock.log start.log /tmp/rep/ 2>/dev/null || true
          cd /tmp/rep && git init -q && git checkout -q -b e2e-report && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "e2e report for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-report
